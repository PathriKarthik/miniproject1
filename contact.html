</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">MyPortfolio</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get In Touch</h2>
            <div class="contact-container">
                
                <div class="card contact-info">
                    <h3 style="color: var(--primary-color); margin-bottom: 1.5rem;">Contact Information</h3>
                    <p><i class="fa-solid fa-envelope" style="color: var(--secondary-color);"></i> lalithareddy648@gmail.com</p>
                    <p><i class="fa-solid fa-phone" style="color: var(--secondary-color);"></i> +91 9398046853</p>
                    <p><i class="fa-solid fa-location-dot" style="color: var(--secondary-color);"></i> Narsaraopet, India</p>
                    
                    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                        <a href="https://github.com/lalithareddy648" target="_blank" class="btn" style="background: rgba(255,255,255,0.1); color: white;"><i class="fa-brands fa-github"></i> GitHub</a>
                        <a href="https://www.linkedin.com/in/lalitha-reddy-a3a289372" target="_blank" class="btn" style="background: rgba(255,255,255,0.1); color: white;"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
                    </div>
                </div>

                <div class="card">
                    <form class="contact-form" onsubmit="event.preventDefault(); alert('Form submitted!');">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" required placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" rows="5" class="form-control" required placeholder="How can I help you?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Send Message</button>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MyPortfolio. All rights reserved.</p>
    </footer>

</body>
